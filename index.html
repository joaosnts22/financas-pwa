<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Minhas Finanças</title>
  <meta name="description" content="Controle financeiro pessoal. Dados salvos só no aparelho.">

  <!-- PWA: manifest e cor da barra do navegador (clara/escura) -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#f4f5fa" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0a0c14" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="dark light">

  <!-- iPhone (Safari): ícone e modo tela cheia ao adicionar à tela inicial -->
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Finanças">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="icon" href="./icons/icon-192.png" type="image/png">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <header class="topo">
    <h1 id="titulo">Minhas Finanças</h1>
    <button id="btn-olho" class="btn-icone" aria-label="Mostrar ou esconder valores"></button>
  </header>

  <main id="conteudo" aria-live="polite">
    <noscript>Este app precisa de JavaScript ativado.</noscript>
  </main>

  <!-- Navegação inferior: 4 abas + botão "+" no meio -->
  <nav id="nav" class="nav-inferior" hidden>
    <button data-aba="inicio"><span data-icone="inicio"></span>Início</button>
    <button data-aba="fluxo"><span data-icone="fluxo"></span>Fluxo</button>
    <button id="btn-mais" class="fab" aria-label="Registrar compra ou lançamento"><span data-icone="mais"></span></button>
    <button data-aba="investir"><span data-icone="investir"></span>Investir</button>
    <button data-aba="mais"><span data-icone="menu"></span>Mais</button>
  </nav>

  <dialog id="modal"></dialog>
  <div id="toast" role="status"></div>

  <!-- type="module" permite usar import/export entre arquivos, sem build -->
  <script type="module" src="./js/app.js"></script>
</body>
</html>
